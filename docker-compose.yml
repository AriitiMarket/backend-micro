services:
  # PostgreSQL Database (Identity Service)
  postgres:
    image: postgres:15-alpine
    container_name: aritii-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: aritii_identity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aritii_identity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: aritii-mongodb
    restart: unless-stopped
    # A single-node replica set. The commerce and delivery services write
    # inside transactions, and MongoDB only supports those on a replica set
    # member — a standalone rejects them with "Transaction numbers are only
    # allowed on a replica set member or mongos". The healthcheck initiates
    # the set on first boot.
    #
    # The key file is the replica set's internal authentication key: MongoDB
    # refuses to start an AUTHORIZED replica set without one. It is generated
    # by the mongo-keyfile service below and never committed.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: aritii
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - mongo_keyfile:/keyfile:ro
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    networks:
      - aritii-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet -u admin -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}).ok }'
          | grep -q 1
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  # Writes the replica set's internal authentication key before MongoDB starts.
  # It runs once and exits; MongoDB waits for it.
  mongo-keyfile:
    image: mongo:7
    container_name: aritii-mongo-keyfile
    restart: "no"
    command:
      - bash
      - -c
      - >-
        printf '%s' "$$(head -c 756 /dev/urandom | base64 | tr -d '\n')" > /keyfile/mongo-keyfile &&
        chmod 400 /keyfile/mongo-keyfile &&
        chown 999:999 /keyfile/mongo-keyfile
    volumes:
      - mongo_keyfile:/keyfile
    networks:
      - aritii-network

  # Redis Cache
  redis:
    image: redis:latest
    container_name: aritii-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-redis123}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Commerce Service
  commerce-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritii-commerce
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      SERVICE_NAME: commerce-service
      INTERNAL_SERVICE_NAME: commerce
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      GATEWAY_URL: http://api-gateway:3000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      API_GATEWAY_URL: http://api-gateway:3000
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      IDENTITY_SERVICE_URL: http://identity:3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Source code mount for development hot-reload (disable in production)
      - ./commerce-service:/app/commerce-service
      - /app/commerce-service/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Delivery Service
  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritii-delivery
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      SERVICE_NAME: delivery-service
      INTERNAL_SERVICE_NAME: delivery
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      GATEWAY_URL: http://api-gateway:3000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      API_GATEWAY_URL: http://api-gateway:3000
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      IDENTITY_SERVICE_URL: http://identity:3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./delivery-service:/app/delivery-service
      - /app/delivery-service/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Identity Service
  identity:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritii-identity
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      SERVICE_NAME: identity-service
      INTERNAL_SERVICE_NAME: identity
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aritii_identity
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      API_GATEWAY_URL: http://api-gateway:3000
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./identity-service:/app/identity-service
      # Inject the RS256 JWT signing key pair at runtime. It is deliberately
      # excluded from the image by identity-service/.dockerignore (never bake
      # secrets into an image); the app reads it at /app/src/config/keys/private.pem.
      - ./identity-service/src/config/keys/private.pem:/app/src/config/keys/private.pem:ro
      - ./identity-service/src/config/keys/public.pem:/app/src/config/keys/public.pem:ro
      - /app/identity-service/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritii-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      SERVICE_NAME: api-gateway
      INTERNAL_SERVICE_NAME: gateway
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      IDENTITY_SERVICE_URL: http://identity:3003
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:4000,http://127.0.0.1:4000,http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      commerce-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      identity:
        condition: service_healthy
    volumes:
      - ./api-gateway:/app/api-gateway
      - /app/api-gateway/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  mongo_keyfile:
    driver: local
  redis_data:
    driver: local

networks:
  aritii-network:
    driver: bridge
