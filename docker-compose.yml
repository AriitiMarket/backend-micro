services:
  # PostgreSQL Database (Identity Service)
  postgres:
    image: postgres:15-alpine
    container_name: aritii-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: aritii_identity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aritii_identity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: aritii-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: aritii
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:latest
    container_name: aritii-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-redis123}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Commerce Service
  commerce-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritii-commerce
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      SERVICE_NAME: commerce-service
      INTERNAL_SERVICE_NAME: commerce
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      GATEWAY_URL: http://api-gateway:3000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      API_GATEWAY_URL: http://api-gateway:3000
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      IDENTITY_SERVICE_URL: http://identity:3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./commerce-service:/app/commerce-service
      - /app/commerce-service/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Delivery Service
  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritii-delivery
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      SERVICE_NAME: delivery-service
      INTERNAL_SERVICE_NAME: delivery
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      GATEWAY_URL: http://api-gateway:3000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      API_GATEWAY_URL: http://api-gateway:3000
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      IDENTITY_SERVICE_URL: http://identity:3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./delivery-service:/app/delivery-service
      - /app/delivery-service/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Identity Service
  identity:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritii-identity
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      SERVICE_NAME: identity-service
      INTERNAL_SERVICE_NAME: identity
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aritii_identity
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      API_GATEWAY_URL: http://api-gateway:3000
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./identity-service:/app/identity-service
      - /app/identity-service/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aritii-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      SERVICE_NAME: api-gateway
      INTERNAL_SERVICE_NAME: gateway
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      IDENTITY_SERVICE_URL: http://identity:3003
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:4000,http://127.0.0.1:4000,http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      commerce-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      identity:
        condition: service_healthy
    volumes:
      - ./api-gateway:/app/api-gateway
      - /app/api-gateway/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  aritii-network:
    driver: bridge
