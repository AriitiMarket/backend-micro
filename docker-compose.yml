services:
  # PostgreSQL Database (Identity Service)
  postgres:
    image: postgres:15-alpine
    container_name: aritii-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aritii_identity}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aritii_identity}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # MongoDB Database (Single-Node Replica Set rs0)
  mongodb:
    image: mongo:7
    container_name: aritii-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-aritii}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - mongo_keyfile:/keyfile:ro
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    networks:
      - aritii-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet -u ${MONGO_INITDB_ROOT_USERNAME:-admin} -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval
          'try { const s = rs.status(); const h = db.hello(); if (s.ok === 1 && (s.myState === 1 || h.isWritablePrimary === true)) { quit(0); } } catch (e) { try { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}); } catch (ie) {} } quit(1);'
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Keyfile Generator for MongoDB Replica Set Auth
  mongo-keyfile:
    image: mongo:7
    container_name: aritii-mongo-keyfile
    restart: "no"
    command:
      - bash
      - -c
      - >-
        if [ ! -s /keyfile/mongo-keyfile ]; then
          head -c 756 /dev/urandom | base64 | tr -d '\r\n' > /keyfile/mongo-keyfile;
        fi &&
        chmod 400 /keyfile/mongo-keyfile &&
        chown 999:999 /keyfile/mongo-keyfile
    volumes:
      - mongo_keyfile:/keyfile
    networks:
      - aritii-network

  # Redis Cache & Pub/Sub
  redis:
    image: redis:latest
    container_name: aritii-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-redis123}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Commerce Service
  commerce-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: commerce-service
    container_name: aritii-commerce
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      SERVICE_NAME: commerce-service
      INTERNAL_SERVICE_NAME: commerce
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      GATEWAY_URL: http://api-gateway:3000
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      API_GATEWAY_URL: http://api-gateway:3000
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      IDENTITY_SERVICE_URL: http://identity:3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - commerce_uploads:/app/commerce-service/src/uploads
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Delivery Service
  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: delivery-service
    container_name: aritii-delivery
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3002
      SERVICE_NAME: delivery-service
      INTERNAL_SERVICE_NAME: delivery
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      GATEWAY_URL: http://api-gateway:3000
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      API_GATEWAY_URL: http://api-gateway:3000
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      IDENTITY_SERVICE_URL: http://identity:3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Identity Service
  identity:
    build:
      context: .
      dockerfile: Dockerfile
      target: identity-service
    container_name: aritii-identity
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3003
      SERVICE_NAME: identity-service
      INTERNAL_SERVICE_NAME: identity
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aritii_identity}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      API_GATEWAY_URL: http://api-gateway:3000
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - identity_uploads:/app/identity-service/src/uploads
      - identity_keys:/app/identity-service/src/config/keys
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # API Gateway (Public Entry Point)
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-gateway
    container_name: aritii-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      SERVICE_NAME: api-gateway
      INTERNAL_SERVICE_NAME: gateway
      INTERNAL_SERVICE_TOKENS: '${INTERNAL_SERVICE_TOKENS:?INTERNAL_SERVICE_TOKENS must be set - copy .env.example to .env}'
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/aritii?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      COMMERCE_SERVICE_URL: http://commerce-service:3001
      DELIVERY_SERVICE_URL: http://delivery-service:3002
      IDENTITY_SERVICE_URL: http://identity:3003
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      commerce-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - aritii-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  mongo_keyfile:
    driver: local
  redis_data:
    driver: local
  commerce_uploads:
    driver: local
  identity_uploads:
    driver: local
  identity_keys:
    driver: local

networks:
  aritii-network:
    driver: bridge
